plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.markdave.depensacircle'
    compileSdk 34

    defaultConfig {
        applicationId 'ph.markdave.depensacircle'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}
